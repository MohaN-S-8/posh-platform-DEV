<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #f7fafc;
          color: #17324d;
          font-family:
            Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
            sans-serif;
        "
      >
        <div style="text-align: center">
          <div
            style="
              width: 42px;
              height: 42px;
              border-radius: 50%;
              border: 4px solid #d9e4ec;
              border-top-color: #17324d;
              margin: 0 auto 14px;
              animation: posh-initial-spin 0.9s linear infinite;
            "
          ></div>
          <div style="font-size: 15px; font-weight: 700">Loading POSH Platform</div>
        </div>
      </div>
    </div>
    <style>
      @keyframes posh-initial-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
